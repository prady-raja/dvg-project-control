name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run check:bundle
      - run: npm test
      # `npm run typecheck` is not run here yet: the existing checkJs baseline has
      # hundreds of unrelated errors. Turn it on once that baseline is cleared.
