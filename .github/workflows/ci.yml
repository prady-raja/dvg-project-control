name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run check:bundle
      - run: npm test
      - run: npm run typecheck
      # Phone layout: no sideways scrolling, wide tables stack into cards. Uses a real browser.
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: npm run check:phone
        env:
          PLAYWRIGHT_MODULES: ${{ github.workspace }}/node_modules/
